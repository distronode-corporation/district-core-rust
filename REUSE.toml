# REUSE metadata (https://reuse.software) for files that cannot carry a comment header:
# JSON, Markdown, images, Cargo.lock and NOTICE; contracts/ and tools/l10n/, which are pinned byte for byte by their SHA256SUMS; and the l10n catalogs and Rust modules that scripts/gen-l10n.py generates (--check compares them byte for byte). Every other file carries its own SPDX header,
# and `reuse lint` in CI fails when one is missing.
version = 1

[[annotations]]
path = [
  "**/*.json",
  "**/*.md",
  "**/*.png",
  "Cargo.lock",
  "NOTICE",
  "contracts/**",
  "tools/l10n/**",
  "crates/district-l10n/catalog/**",
  "crates/district-l10n/src/generated/**",
  "crates/district-l10n/tests/generated/**",
]
precedence = "aggregate"
SPDX-FileCopyrightText = "Distronode Corporation"
SPDX-License-Identifier = "Apache-2.0"
