[webhook.url_fixed]
en = "The URL cannot be changed. Delete this webhook and add another to move it."
fr = "L'URL ne peut pas être modifiée. Supprimez ce webhook et ajoutez-en un autre pour la déplacer."
ctx = "body"
screen = "scheduling developer writes"
tier = "T3"
state = "reviewed"
note = "The URL is not editable, because `webhooks.patch` takes only `events` and `fields`. Offering a box that silently kept the old value is worse than not offering one: the person believes deliveries have moved."

[webhook.url_hint]
en = "Where each delivery is posted. https only."
fr = "Où chaque envoi est transmis. https seulement."
ctx = "a11y"
screen = "scheduling developer writes"
tier = "T3"
state = "reviewed"

