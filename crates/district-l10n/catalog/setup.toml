ctx = "body"
screen = "setup.golive"
state = "reviewed"
note = "⛔ A CONSENT RECORD, NOT ONLY COPY. The test-call route stores its own copy of these words (testCallI18n consentWording) for the owner's language; this is the same text, character for character. Change both or neither."

