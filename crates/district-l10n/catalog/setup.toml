[setup.golive_consent_wording]
en = "Call me now at the number I entered, from my District number, so I can hear my receptionist answer. This is a test call of up to two minutes. It is not billed, and the receptionist cannot transfer, book, email or text during it. The call is transcribed and summarized in my call log like any other call."
