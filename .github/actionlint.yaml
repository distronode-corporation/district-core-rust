# actionlint's configuration, for running it by hand (CI runs zizmor, not
# actionlint):
#
#   docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:latest -no-color
paths:
  .github/workflows/{audit,ci,voice}.yml:
    ignore:
      # This repository's own composite actions under .github/actions/ are
      # called with GitHub's self-repository syntax (`uses: $/.github/actions/...`,
      # since July 2026: the calling workflow's own repository at the commit that
      # is running), which zizmor's self-repository audit asks for and actionlint
      # 1.7.12 reads as a remote action without a ref. Only that message is
      # ignored, and only in these files.
      - 'specifying action "\$/\.github/actions/[a-z0-9-]+" in invalid format because ref is missing'
