name: Bug report
description: Report a reproducible bug in the District AI core crates (not a question or a feature request).
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Before you start, please [search existing issues](https://github.com/distronode-corporation/district-core-rust/issues?q=is%3Aissue).** It may already be reported or fixed.

        **A bug you see in an app** goes to that app's repository ([Linux](https://github.com/distronode-corporation/district-linux/issues), [Windows](https://github.com/distronode-corporation/district-windows/issues)) unless you have traced it to a crate here.

        **Do not report a security vulnerability here.** Report it privately through [Report a vulnerability](https://github.com/distronode-corporation/district-core-rust/security/advisories/new) instead; see [SECURITY.md](https://github.com/distronode-corporation/district-core-rust/blob/main/SECURITY.md).

        **Nothing you paste here is private.** Leave out tokens, and leave out anything about the people your workspace talks to: names, phone numbers, transcripts, messages. Redact what you would not publish.
  - type: checkboxes
    id: prechecks
    attributes:
      label: Before submitting
      options:
        - label: I've searched existing issues and this isn't a duplicate.
          required: true
        - label: I'm on the latest release or a build of `main`.
          required: true
        - label: This is not a security issue (those go to [Report a vulnerability](https://github.com/distronode-corporation/district-core-rust/security/advisories/new)).
          required: true
        - label: I've removed every token and every piece of customer or caller data from what I'm pasting.
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What's the bug?
      description: What happened, and what did you expect instead? Name the crate if you know it.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact steps, ideally a failing test or the commands you ran, so a maintainer can reproduce it.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag, or the commit you built from (`git rev-parse --short HEAD`).
      placeholder: v1.0.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system, target and Rust version
      description: "`rustc --version` and the target, for example x86_64-pc-windows-msvc."
      placeholder: Windows 11 24H2, x86_64-pc-windows-msvc, rustc 1.92.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Output
      description: What the build or the test printed. Optional, but it often decides the issue. Read it before pasting.
      render: text
